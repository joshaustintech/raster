baseURL = "https://example.org/"
title = "Raster example"
locale = "en"
[module]
  replacements = "github.com/joshaustintech/raster -> ../.."
  [[module.imports]]
    path = "github.com/joshaustintech/raster"

[params.nav.cta]
  label = "Contact"
  url = "/about/"
[params.footer]
  statement = "Building quiet systems for loud problems."
[menus]
  [[menus.main]]
    name = "Work"
    url = "/work/"
    weight = 1
  [[menus.main]]
    name = "Writing"
    url = "/writing/"
    weight = 2
  [[menus.footer]]
    name = "Site"
    identifier = "f-site"
    weight = 1
  [[menus.footer]]
    name = "Work"
    parent = "f-site"
    url = "/work/"
    weight = 1

# Required by the theme: figure/quote hooks need block images; Chroma must emit classes.
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false
[markup.highlight]
  noClasses = false
  lineNos = false
