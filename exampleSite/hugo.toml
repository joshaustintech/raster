baseURL = "https://example.org/"
title = "Raster example"
locale = "en"
[module]
  replacements = "github.com/joshaustintech/raster -> ../.."
  [[module.imports]]
    path = "github.com/joshaustintech/raster"

[params.nav.cta]
  label = "Contact"
  url = "/about/"
[params.footer]
  statement = "Building quiet systems for loud problems."
[menus]
  [[menus.main]]
    name = "Work"
    url = "/work/"
    weight = 1
  [[menus.main]]
    name = "Writing"
    url = "/writing/"
    weight = 2
  [[menus.footer]]
    name = "Site"
    identifier = "f-site"
    weight = 1
  [[menus.footer]]
    name = "Work"
    parent = "f-site"
    url = "/work/"
    weight = 1

# Required by the theme: figure/quote hooks need block images; Chroma must emit classes.
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false
[markup.highlight]
  noClasses = false
  lineNos = false

# Notes: embed output format (baseName "embed/index" yields /notes/<id>/embed/; Hugo `path` would prefix the URL instead). Theme config is not merged into consuming sites, so copy this block.
[outputFormats.embed]
  mediaType = "text/html"
  baseName = "embed/index"
  notAlternative = true
  isHTML = true
