baseURL = "https://example.org/"
title = "Raster example"
locale = "en"
enableRobotsTXT = true

[params]
  description = "Notes, case studies and writing on building quiet systems."
  [params.author]
    # Fictional persona; email is an obviously fake address.
    name = "Avery Example"
    handle = "@avery"
    email = "hello@example.org"
  [[params.social]]
    name = "GitHub"
    url = "https://github.com/example"

[sitemap]
  changefreq = "monthly"
  priority = 0.5
  filename = "sitemap.xml"
[module]
  replacements = "github.com/joshaustintech/raster -> ../.."
  [[module.imports]]
    path = "github.com/joshaustintech/raster"

[params.nav.cta]
  label = "Contact"
  url = "/about/"
# Nav: mark defaults to the site title; cta is the primary button.
[params.nav]
  mark = "Avery Example"
[params.footer]
  # Statement shown large in the footer; legal / legalExtra override the copyright line.
  statement = "Building quiet systems for loud problems."
  legal = "Fictional example site"
# Contact card on /about/ (action defaults to mailto:<author.email>; js=false disables progressive enhancement).
[params.contact]
  eyebrow = "Contact"
  title = "Start a conversation"
  text = "Demonstration form only. Nothing is sent anywhere."
  help = "A few sentences on the problem and timeline."
  note = "Replies within a week. Fictional."
  submit = "Send message"
  company = true
  newsletter = "Send me the monthly writing"
# Notes: replyTo adds a Reply link to each note card.
[params.notes]
  replyTo = "mailto:hello@example.org"
[menus]
  [[menus.main]]
    name = "Work"
    url = "/work/"
    weight = 1
  [[menus.main]]
    name = "Writing"
    url = "/writing/"
    weight = 2
  [[menus.main]]
    name = "Notes"
    url = "/notes/"
    weight = 3
  [[menus.footer]]
    name = "Site"
    identifier = "f-site"
    weight = 1
  [[menus.footer]]
    name = "Work"
    parent = "f-site"
    url = "/work/"
    weight = 1
  [[menus.footer]]
    name = "Writing"
    parent = "f-site"
    url = "/writing/"
    weight = 2
  [[menus.footer]]
    name = "Notes"
    parent = "f-site"
    url = "/notes/"
    weight = 3
  [[menus.footer]]
    name = "About"
    parent = "f-site"
    url = "/about/"
    weight = 4

# Required by the theme: figure/quote hooks need block images; Chroma must emit classes.
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false
[markup.highlight]
  noClasses = false
  lineNos = false

# Notes: embed output format (baseName "embed/index" yields /notes/<id>/embed/; Hugo `path` would prefix the URL instead). Theme config is not merged into consuming sites, so copy this block.
[outputFormats.embed]
  mediaType = "text/html"
  baseName = "embed/index"
  notAlternative = true
  isHTML = true

# Feeds: RSS (site + sections) is built in; Atom for Notes and JSON Feed for the site are custom formats. Copy these blocks.
[outputFormats.atom]
  mediaType = "application/atom+xml"
  baseName = "atom"
  isPlainText = true
[outputFormats.jsonfeed]
  mediaType = "application/feed+json"
  baseName = "feed"
[mediaTypes."application/feed+json"]
  suffixes = ["json"]
[mediaTypes."application/atom+xml"]
  suffixes = ["xml"]
[outputs]
  home = ["html", "rss", "jsonfeed"]
  section = ["html", "rss"]
