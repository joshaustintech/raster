{{ define "main" }}
{{ partial "hero.html" . }}
<div class="rs-wrap">
  {{- $pag := .Paginate .Pages.ByDate.Reverse -}}
  <div class="rs-cols"><div class="rs-feed h-feed">
    {{- range $pag.Pages }}
    {{ partial "card-post.html" (dict "page" .) }}
    {{- end }}
  </div></div>
  {{ partial "pager.html" $pag }}
</div>
{{ partial "notes-js.html" "notes" }}
{{ end }}
