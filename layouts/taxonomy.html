{{- /* Taxonomy index: plain term list with .rs-tag. Off by default (disableKinds). */ -}}
{{ define "main" }}
{{ partial "hero.html" . }}
<div class="rs-wrap"><div class="rs-cols">
  <ul class="rs-actions rs-taglist">
    {{- range .Data.Terms.Alphabetical }}<li><a class="rs-tag rs-tag--quiet" href="{{ .Page.RelPermalink }}">{{ .Page.Title }} {{ .Count }}</a></li>{{ end }}
  </ul>
</div></div>
{{ end }}
