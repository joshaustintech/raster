<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../css/fonts.css"><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/raster.css">
<meta charset="utf-8">
<title>Raster</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--paper); color:var(--ink); font-family:var(--font-display); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .fleece { fill:var(--fleece); }
  .deep { fill:var(--ink); }
  .olive { fill:var(--olive); }
  .signal { fill:var(--signal); }
  rect { rx:var(--radius-0); }
  .mark { stroke:var(--ink); stroke-width:1; fill:none; }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-3); max-width:440px; }
  .name { margin:0; font-size:120px; line-height:.92; font-weight:700; letter-spacing:-.025em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 4px; font-family:var(--font-text); font-size:14px; line-height:16px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      fleece 152×152 + 152×64 (the brand hue, largest) · ink 240×192 bled off the top · olive 80×240 bled off the right · signal 64×64 once (the one loud note) — ≈40% of 960×288
  arrangement a flush modular field grid: grid-field (64px) cells, grid-gutter (24px) gaps, every block spanning whole fields plus gutters
  pattern     registration crosses at empty gutter intersections, ink, 1px — "the grid decides": the grid itself is the motif
  scales      fields grid-field 64, gutters grid-gutter 24, top/bottom inset space-3; corners radius-0 throughout
-->
<rect class="fleece" x="0" y="24" width="152" height="152"/><rect class="deep" x="176" y="-16" width="240" height="192"/><rect class="signal" x="176" y="200" width="64" height="64"/><rect class="olive" x="440" y="24" width="80" height="240"/><rect class="fleece" x="264" y="200" width="152" height="64"/>
<path class="mark" d="M72 188h8M76 184v8"/><path class="mark" d="M72 276h8M76 272v8"/><path class="mark" d="M160 12h8M164 8v8"/><path class="mark" d="M160 100h8M164 96v8"/><path class="mark" d="M160 188h8M164 184v8"/><path class="mark" d="M160 276h8M164 272v8"/><path class="mark" d="M248 188h8M252 184v8"/><path class="mark" d="M248 276h8M252 272v8"/><path class="mark" d="M336 188h8M340 184v8"/><path class="mark" d="M336 276h8M340 272v8"/><path class="mark" d="M424 12h8M428 8v8"/><path class="mark" d="M424 188h8M428 184v8"/><path class="mark" d="M424 276h8M428 272v8"/>
</svg>
</div>
<div class="words">
<h1 class="name">Raster</h1>
<p class="tag">A Swiss grid for an engineer’s work, writing and notes.</p>
</div>
</div>
</body>
</html>
